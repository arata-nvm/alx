name: Import KdB

on:
  schedule:
    # 01:30 JST, after kdb-crawler's daily crawl at 00:00 JST.
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-kdb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Test importer
        run: npm run test:import-kdb

      - name: Import KdB data
        run: npm run import:kdb

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- src/resources/kdb2026.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Build with updated data
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/resources/kdb2026.json
          git commit -m "chore: update KdB data"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
